<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="diseñologin.css">
</head>
<body>
    <div class="cabeza-content">
        <img src="UAEM.png" alt="Logo de la UAEM" class="logo-izq">
        <h1>PRESTAMO DE EQUIPOS DE FACULTAD DE CONTADURIA, ADMINISTRACION E INFORMACTICA</h1>
        <img src="fcaei.png" alt="Logo de la FCAEI" class="logo-der">
    </div>
    <div class="login-container">
        <h2>INICIA SESION</h2>
        <form action="#" method="post">
            <div class="box">
                <label for="username">Ingrese Matricula/Numero Control:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="box">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">INGRESAR</button>
        </form>
    </div>
</body>
</html>
